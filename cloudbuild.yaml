# Cloud Build: build the Docker image with the (public) App Check site key.
# Used by .github/workflows/deploy-cloud-run.yml and scripts/deploy-cloud-run.sh
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_RECAPTCHA_ENTERPRISE_SITE_KEY=${_RECAPTCHA_SITE_KEY}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: ''
  _RECAPTCHA_SITE_KEY: ''
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1200s
